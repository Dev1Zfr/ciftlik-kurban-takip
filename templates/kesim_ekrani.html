<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Canlı Kesim Sırası</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="refresh" content="30"> <!-- 30 Saniyede Bir Otomatik Yeniler -->
</head>
<body class="bg-dark text-white p-4">
    <h1 class="text-center text-warning fw-bold mb-4">🥩 CANLI KESİM SIRASI</h1>

    <div class="row justify-content-center">
        {% for k in kurbanlar %}
        <div class="col-md-8 mb-3">
            <div class="card bg-secondary text-white shadow">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <span class="badge bg-warning text-dark fs-4 me-3">Sıra: #{{ k.kesim_sirasi }}</span>
                        <span class="fs-4 fw-bold">Küpe No: {{ k.kupe_no }}</span>
                        <span class="ms-3 badge {% if k.kesim_durumu == 'Kesildi' %}bg-success{% else %}bg-danger{% endif %} fs-5">{{ k.kesim_durumu }}</span>
                    </div>
                    <div class="d-flex gap-2">
                        <!-- YUKARI AŞAĞI KAYDIRMA -->
                        <form action="/kesim-sira-degistir/{{ k.id }}/ust" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="btn btn-light fw-bold">↑ Üste Al</button></form>
                        <form action="/kesim-sira-degistir/{{ k.id }}/alt" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="btn btn-light fw-bold">↓ Alta Al</button></form>

                        <!-- KESİLDİ İŞARETLEME -->
                        {% if k.kesim_durumu != 'Kesildi' %}
                        <form action="/kesildi-isaretle/{{ k.id }}" method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="btn btn-success fw-bold ms-3">✓ KESİLDİ</button>
                        </form>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
        {% else %}
        <h4 class="text-center text-muted">Kesim sırasına alınmış satılan hayvan bulunamadı.</h4>
        {% endfor %}
    </div>
</body>
</html>
