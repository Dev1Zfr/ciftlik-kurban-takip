<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlk Kurulum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 520px;">
        <div class="card shadow border-0">
            <div class="card-header bg-success text-white fw-bold">Çiftlik Sistemini İlk Kez Kurun</div>
            <div class="card-body p-4">
                <p class="text-muted">İlk yönetici hesabını oluşturun. Bu ekran bir hesap oluşturulduktan sonra kapanır.</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endwith %}
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <label class="form-label">Yönetici kullanıcı adı</label>
                    <input type="text" name="username" maxlength="50" class="form-control mb-3" required>
                    <label class="form-label">Parola</label>
                    <input type="password" name="password" minlength="10" class="form-control mb-3" required>
                    <button class="btn btn-success w-100" type="submit">Yönetici Hesabını Oluştur</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
