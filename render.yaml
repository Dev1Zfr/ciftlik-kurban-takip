services:
  - type: web
    name: ciftlik-kurban-takip
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ciftlik-veritabani
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.14

databases:
  - name: ciftlik-veritabani
    plan: free
    databaseName: ciftlik
    user: ciftlik_kullanici
